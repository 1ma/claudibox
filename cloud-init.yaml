#cloud-config

package_update: true
package_upgrade: true

timezone: Europe/Andorra

packages:
  - 7zip
  - bash-completion
  - bubblewrap
  - ca-certificates
  - curl
  - erlang
  - git
  - htop
  - jq
  - mariadb-client
  - nano
  - net-tools
  - php-cli
  - php-curl
  - php-zip
  - postgresql-client
  - ripgrep
  - socat
  - sqlite3
  - telnet
  - tree
  - unzip
  - yq

users:
  - name: bofh
    shell: /bin/bash
    lock_passwd: true

write_files:
  - path: /home/bofh/.config/opencode/AGENTS.md
    owner: bofh:bofh
    permissions: "0644"
    defer: true
    content: &pautes |
      # Pautes globals per a agents

      ## Idioma i to
      Respon sempre en català amb un to formal.
      Malgrat això, tota la producció de codi i de documentació ha de ser sempre en anglès si no indico una altra cosa explícitament.

      ## Eines disponibles
      - Networking (curl, net-tools, socat, telnet)
      - Clients de bases de dades (MariaDB, Postgres, SQLite3)
      - Python CLI
      - PHP & Composer
      - Erlang & rebar3
      - Processament de streams (jq, yq, ripgrep)

      ## Política de Git
      No has de fer commits tu directament a cap projecte Git.
      Qualsevol canvi que proposis fés-lo només localment (prèvia aprovació) sense ni afegir-lo al staging area del repo.

      ## Entorn d'execució
      Corres dins d'una màquina virtual, no directament al host. Però les aplicacions en les que treballaràs generalment corren en Docker exposades al host, no dins de la teva VM.
      Per tant per accedir a les aplicacions que s'estàn desenvolupant al host et caldrà saber la seva IP a on conectar, i a vegades ajustar la resolució del DNS.
      - IP del host: `ip route show default | awk '{print $3}'` (típicament la gateway per defecte).
      - No tens sudo ni root dins la VM.
      - Per accedir a serveis del host que escolten amb hostname (e.g. pàgina web com ara `app.localhost` servida amb Caddy), cal usar `curl --resolve hostname:port:<host_ip>` o el header `Host`, ja que `*.localhost` resol a 127.0.0.1 dins la VM.
      - Quan no es fa servir hostname (e.g. una API oberta en clar a un port TCP qualsevol) pots accedir directament per IP:PORT sense preocupar-te del hostname.

  - path: /home/bofh/.claude/CLAUDE.md
    owner: bofh:bofh
    permissions: "0644"
    defer: true
    content: *pautes

  - path: /home/bofh/.claude/settings.json
    owner: bofh:bofh
    permissions: "0644"
    defer: true
    content: |
      {
        "permissions": {
          "allow": [
            "Read",
            "Grep",
            "Glob",
            "Bash(cat:*)",
            "Bash(curl:*)",
            "Bash(find:*)",
            "Bash(grep:*)",
            "Bash(head:*)",
            "Bash(jq:*)",
            "Bash(ls:*)",
            "Bash(tail:*)",
            "Bash(wc:*)",
            "Bash(yq:*)"
          ],
          "defaultMode": "default"
        },
        "model": "claude-opus-4-6",
        "sandbox": {
          "enabled": true,
          "failIfUnavailable": true,
          "autoAllowBashIfSandboxed": true,
          "network": {
            "allowedDomains": [
              "api.anthropic.com"
            ]
          },
          "filesystem": {
            "denyRead": [
              "/"
            ],
            "allowRead": [
              "~/workspace",
              "~/.claude"
            ]
          }
        },
        "effortLevel": "medium",
        "theme": "dark"
      }
  - path: /home/bofh/.erlang
    owner: bofh:bofh
    permissions: "0644"
    defer: true
    content: |
      application:set_env(kernel, shell_history, enabled).

runcmd:
  - curl -o /usr/local/bin/rebar3 https://s3.amazonaws.com/rebar3/rebar3
  - chmod +x /usr/local/bin/rebar3
  - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
  - php -r "if (hash_file('sha384', 'composer-setup.php') === 'c8b085408188070d5f52bcfe4ecfbee5f727afa458b2573b8eaaf77b3419b0bf2768dc67c86944da1544f06fa544fd47') { echo 'Installer verified'.PHP_EOL; } else { echo 'Installer corrupt'.PHP_EOL; unlink('composer-setup.php'); exit(1); }"
  - HOME=/root php composer-setup.php --install-dir=/usr/local/bin --filename=composer
  - php -r "unlink('composer-setup.php');"
  - curl -fsSL https://deb.nodesource.com/setup_lts.x | bash -
  - apt-get install -y nodejs
  - su - bofh -c "mkdir -p ~/.local && npm config set prefix ~/.local"
  - su - bofh -c "npm install -g @anthropic-ai/claude-code opencode-ai@latest"
  - su - bofh -c "curl -fsSL https://raw.githubusercontent.com/rtk-ai/rtk/refs/heads/master/install.sh | sh"
  - su - bofh -c "rtk init -g --auto-patch"
  - su - bofh -c "rtk init -g --auto-patch --opencode"
  - su - bofh -c "rtk telemetry disable"
  - su - bofh -c "curl -LO https://github.com/aovestdipaperino/tokensave/releases/download/v7.11.1/tokensave-v7.11.1-x86_64-linux.tar.gz"
  - su - bofh -c "tar zxf tokensave-v7.11.1-x86_64-linux.tar.gz"
  - su - bofh -c "mv tokensave /home/bofh/.local/bin/tokensave"
  - su - bofh -c "rm tokensave-v7.11.1-x86_64-linux.tar.gz"
  - su - bofh -c "tokensave install --agent claude --git-hook=no"
  - su - bofh -c "tokensave install --agent opencode --git-hook=no"
